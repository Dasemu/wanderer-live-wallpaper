<!doctype html>
<!-- Dev harness: renders the app's shaders in WebGL2 (same GLSL ES 3.00). Serve the repo root:
     python3 -m http.server 8000  ->  http://localhost:8000/tools/preview/ -->
<html><head><meta charset="utf-8"><title>Wanderer preview</title>
<style>body{margin:0;background:#111;color:#ddd;font:14px sans-serif;display:flex;gap:16px;padding:12px}
canvas{height:calc(100vh - 24px);aspect-ratio:1080/2400;background:#000}label{display:block;margin:8px 0}</style></head>
<body><canvas id="c" width="1080" height="2400"></canvas>
<div><label>Time <input id="t" type="range" min="0" max="1439" value="720" style="width:300px"> <span id="tl"></span></label>
<label>Parallax <input id="px" type="range" min="0" max="1" step="0.01" value="0.5"></label>
<label><input id="anim" type="checkbox" checked> animate</label><pre id="info"></pre></div>
<script type="module">
const A = '../../app/src/main/assets/', R = '../../app/src/main/res/drawable-nodpi/';
const bust = '?v=' + Date.now();
const txt = p => fetch(p + bust, {cache: 'no-store'}).then(r => r.text());
const [vs, fogFs, sceneFs, palJson, sceneJson] = await Promise.all([
  txt(A+'shaders/fullscreen.vert'), txt(A+'shaders/fog.frag'), txt(A+'shaders/scene.frag'),
  txt(A+'palettes.json'), txt(A+'scene.json')]);
const pal = JSON.parse(palJson).palettes, cfg = JSON.parse(sceneJson);
const c = document.getElementById('c'), gl = c.getContext('webgl2',{preserveDrawingBuffer:true});
function prog(fs){const p=gl.createProgram();for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(sh);gl.attachShader(p,sh);}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw gl.getProgramInfoLog(p);return p;}
const pFog = prog(fogFs), pScene = prog(sceneFs);
function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src+bust;});}
const [base, plate, mask] = await Promise.all([img(R+'scene_base.webp'), img(R+'scene_plate.webp'), img(R+'scene_mask.png')]);
function tex(i){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,i);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
const tBase=tex(base), tPlate=tex(plate), tMask=tex(mask);
const W=c.width,H=c.height, fw=Math.round(W/3), fh=Math.round(H/3);
const fogTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,fogTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,fw,fh,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
const fbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fogTex,0);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
const lin=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255].map(v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);});};
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
// Madrid, early November (matches SkyModel's keyframe layout).
const Rm=8*60+1, Nm=13*60+12, Sm=18*60+23;
const keys=[[Rm-100,'night'],[Rm-40,'dawn'],[Rm,'sunrise'],[Math.min(Rm+120,(Rm+Nm)/2),'morning'],[Nm,'noon'],[Math.max(Sm-70,(Nm+Sm)/2),'golden'],[Sm,'sunset'],[Sm+40,'dusk'],[Sm+100,'night']];
function palette(m){if(m<keys[0][0]||m>=keys[8][0])return mk(pal.night,pal.night,0);for(let i=0;i<8;i++)if(m>=keys[i][0]&&m<keys[i+1][0])return mk(pal[keys[i][1]],pal[keys[i+1][1]],sm(keys[i][0],keys[i+1][0],m));}
function mk(a,b,t){const o={};for(const k in a){o[k]=typeof a[k]==='string'?lin(a[k]).map((v,i)=>v+(lin(b[k])[i]-v)*t):a[k]+(b[k]-a[k])*t;}return o;}
const pa=base.width/base.height;
function rect(par,depth){const pw=W/cfg.visibleWidth,ph=pw/pa;let sx=W/pw,sy=H/ph,oy=0;
 if(ph<H){oy=-(H-ph)/ph;} else {oy=Math.min(Math.max(cfg.cropAnchorV-0.5*sy,0),1-sy);} 
 const margin=1-sx;const ox=margin/2+(par-0.5)*margin*depth;return [sx,sy,ox,oy];}
const t0=performance.now();let frozen=0;
function u(p,n){return gl.getUniformLocation(p,n);}
function render(){
 const m=+document.getElementById('t').value;document.getElementById('tl').textContent=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
 const anim=document.getElementById('anim').checked;const sec=anim?(performance.now()-t0)/1000:frozen;if(anim)frozen=sec;
 const par=+document.getElementById('px').value;const P=palette(m);
 const rp=rect(par,cfg.parallax.plate),rm=rect(par,cfg.parallax.mid),rf=rect(par,cfg.parallax.fg);
 const screenHorizon=1-(cfg.horizon-rp[3])/rp[1];
 const elev=Math.sin(Math.PI*Math.min(1,Math.max(-0.2,(m-Rm)/(Sm-Rm))))*0.55-0.02;const dayP=(m-Rm)/(Sm-Rm);
 const sunX=0.5+(dayP-0.5)*0.9, sunY=screenHorizon+0.42*elev, sunVis=sm(-0.12,0.02,elev);
 const nightLen=1440-(Sm-Rm), np=(((m-Sm)%1440)+1440)%1440/nightLen, arc=np<=1?Math.sin(Math.PI*np):-0.3;
 const moonX=0.15+0.7*Math.min(1,np), moonY=screenHorizon-0.04+0.42*arc, moonVis=sm(-0.05,-0.15,elev)*sm(-0.1,0.15,arc), phase=0.42;
 const illum=0.5*(1-Math.cos(2*Math.PI*phase)), mw=moonVis*(0.25+0.75*illum), tot=Math.max(sunVis+mw,1e-4);
 const lx=(sunX*sunVis+moonX*mw)/tot, ly=(sunY*sunVis+moonY*mw)/tot, lc=P.sun.map((v,i)=>v*sunVis+[0.55,0.65,0.9][i]*mw*0.45);
 const wrap=v=>((v%32)+32)%32, d=cfg.drift;
 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.viewport(0,0,fw,fh);gl.useProgram(pFog);
 gl.uniform4fv(u(pFog,'uRect'),rp);gl.uniform1f(u(pFog,'uAspect'),pa);gl.uniform1f(u(pFog,'uHorizon'),cfg.horizon);gl.uniform1i(u(pFog,'uOctaves'),5);
 gl.uniform2f(u(pFog,'uOffset0'),wrap(sec*d.haze[0]*10),wrap(sec*d.haze[1]*10));gl.uniform2f(u(pFog,'uOffset1'),wrap(sec*d.sea[0]*10),wrap(sec*d.sea[1]*10));
 gl.uniform2f(u(pFog,'uOffset2'),wrap(sec*d.wisps[0]*10),wrap(sec*d.wisps[1]*10));gl.uniform2f(u(pFog,'uWarp'),wrap(sec*d.warp[0]*10),wrap(sec*d.warp[1]*10));
 gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(pScene);
 [[tBase,'uBase'],[tPlate,'uPlate'],[tMask,'uMask'],[fogTex,'uFog']].forEach(([t,n],i)=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(u(pScene,n),i);});
 gl.uniform4fv(u(pScene,'uRectPlate'),rp);gl.uniform4fv(u(pScene,'uRectMid'),rm);gl.uniform4fv(u(pScene,'uRectFg'),rf);
 for(const k of ['skyTop','skyHorizon','sun','ambient','fogLit','fogShadow'])gl.uniform3fv(u(pScene,'u'+k[0].toUpperCase()+k.slice(1)),P[k]);
 gl.uniform3fv(u(pScene,'uLightColor'),lc);gl.uniform1f(u(pScene,'uGlow'),P.glow);gl.uniform1f(u(pScene,'uStars'),P.stars);gl.uniform1f(u(pScene,'uHaze'),P.haze);
 gl.uniform2f(u(pScene,'uSunPos'),sunX,sunY);gl.uniform2f(u(pScene,'uMoonPos'),moonX,moonY);gl.uniform2f(u(pScene,'uLightPos'),lx,ly);
 gl.uniform1f(u(pScene,'uSunVis'),sunVis);gl.uniform1f(u(pScene,'uMoonVis'),moonVis);gl.uniform1f(u(pScene,'uMoonPhase'),phase);
 gl.uniform1f(u(pScene,'uScreenAspect'),W/H);gl.uniform1f(u(pScene,'uPaintAspect'),pa);gl.uniform1f(u(pScene,'uScreenHorizon'),screenHorizon);
 gl.uniform1f(u(pScene,'uHorizon'),cfg.horizon);gl.uniform1f(u(pScene,'uSkyRef'),cfg.skyRef);gl.uniform1f(u(pScene,'uTime'),sec%628.3);
 gl.uniform1f(u(pScene,'uFlowTime'),(sec/cfg.flow.periodSeconds)%1000);gl.uniform1f(u(pScene,'uFlowFog'),cfg.flow.fog);gl.uniform1f(u(pScene,'uFlowSky'),cfg.flow.sky);gl.uniform1f(u(pScene,'uZoom'),0);
 gl.drawArrays(gl.TRIANGLES,0,3);
 document.getElementById('info').textContent=`sun ${sunX.toFixed(2)},${sunY.toFixed(2)} vis ${sunVis.toFixed(2)}\nhorizon ${screenHorizon.toFixed(3)}`;
 }
function frame(){render();requestAnimationFrame(frame);}
window.setTime=v=>{document.getElementById('t').value=v;};
// Contact sheet for quick review: sheet([minutes...]) renders each hour side by side below the controls.
window.sheet=(times,w=270)=>{const h=w*H/W,s=document.createElement('canvas');s.width=w*times.length;s.height=h;s.id='sheet';
 const g=s.getContext('2d');times.forEach((m,i)=>{setTime(m);render();g.drawImage(c,i*w,0,w,h);g.fillStyle='#fff';g.font='16px sans-serif';g.fillText(`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`,i*w+6,20);});
 document.getElementById('sheet')?.remove();document.body.prepend(s);return s.toDataURL('image/jpeg',0.85);};
const q=new URLSearchParams(location.search).get('sheet');
if(q){document.getElementById('anim').checked=false;const url=sheet(q.split(",").map(Number),+(new URLSearchParams(location.search).get("w")||300));document.body.innerHTML=`<img src="${url}">`;document.body.style.padding='0';}
else frame();
</script></body></html>
